<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mutakit — test harness</title>
  <link rel="stylesheet" href="harness.css">
</head>
<body>
  <header class="harness-header">
    <h1>Mutakit</h1>
    <p class="tagline">Declarative geometry for graphical user interfaces.</p>
    <p class="source-note">
      loading <code>../source/entries/full.js</code> as ES modules —
      this page <strong>must be served</strong>, not opened over <code>file://</code>
    </p>
  </header>

  <main>
    <section class="panel" id="sandbox">
      <h2>Sandbox</h2>
      <!-- Tests mount into #scratch and clean up after themselves. -->
      <div id="scratch"></div>
      <div id="demo"></div>
    </section>

    <section class="panel" id="results-panel">
      <h2>Tests <span id="summary" class="summary"></span></h2>
      <ol id="results" class="results"></ol>
    </section>
  </main>

  <script type="module" src="test.js"></script>
</body>
</html>
