<!DOCTYPE html>
<html lang="en">

  <link rel="stylesheet" href="harness.css">
</head>
<body>
  <header class="harness-header">
    <h1>Mutakit</h1>

  <main>
    <!-- Scratch area: drop markup here for whatever this project needs. -->

    <section class="panel" id="results-panel">
      <h2>Tests <span id="summary" class="summary"></span></h2>
      <ol id="results" class="results"></ol>

  <!-- Library under test. Swap this line to test the build output instead. -->

  <!-- Tiny assertion helper. Rarely needs editing. -->
