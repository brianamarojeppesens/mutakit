<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mutakit — S2, the application chrome</title>
<style>html,body{margin:0;height:100%;font:14px/1.5 system-ui,sans-serif}</style>
</head>
<body>
<!--
  S2 — the application chrome (PLAN.md §1.3): a docked shell, a settings dialog
  with validation, a command palette, a context menu, and toasts. The M3/M4 demo.
-->
<script type="module">
import { Mutakit } from "../source/entries/full.js";

const app = Mutakit.mount(document.body, { sizing: "viewport" });

app.dock({
  regions: {
    top:    { size: 44, id: "menubar" },
    start:  { size: 240, id: "explorer" },
    bottom: { size: 26, id: "statusbar" },
    center: { id: "workspace" }
  }
});

const bar = Mutakit.byId("menubar");
bar.create("button", { text: "Settings…", at: "left", inset: 8, on: { activate: openSettings } });
bar.create("pane", { content: "Ctrl+K for the command palette", at: "right", inset: 12 });
Mutakit.byId("statusbar").create("pane", { content: "Ready", at: "left", inset: 8 });

// Written the way Appendix B.2 writes it: one declarative tree, slots filled
// by name, buttons invoking the dialog's own commands (§18.2). Nothing here is
// a function, so the whole dialog serializes.
function openSettings() {
  const dialog = Mutakit.create("dialog", {
    id: "prefs", title: "Settings", description: "Changes apply immediately.",
    size: { w: 480, h: "auto" },
    body: { type: "form", id: "prefs-form",
      values: { email: "", port: 8080 },
      schema: { email: { type: "string", required: true, format: "email" },
                port: { type: "number", min: 1, max: 65535, integer: true } },
      children: [
        { type: "field", label: "Notification email", required: true,
          control: { type: "text", name: "email", placeholder: "you@example.com" } },
        { type: "field", label: "Port", description: "1–65535",
          control: { type: "number", name: "port", min: 1, max: 65535 } }
      ]
    },
    actions: [
      { label: "Cancel", command: "cancel" },
      { label: "Save", command: "submit", variant: "primary" }
    ]
  });
  dialog.on("action", (event) => {
    if (event.detail.action !== "submit") return;
    Mutakit.byId("prefs-form").submit().then((ok) => {
      if (ok) Mutakit.create("toast", { text: "Settings saved", variant: "success" });
    });
  });
}

// A command palette on Mod+K, and a context menu anywhere in the workspace.
const workspace = Mutakit.byId("workspace");

Mutakit.default.service("shortcuts").bind("Mod+K", () => {
  const palette = Mutakit.create("modal", {
    id: "palette", size: { w: 520, h: "auto" }, at: "top", inset: { top: 80 },
    dismiss: "light", backdrop: true, title: "Command palette"
  });
  const combo = palette.create("combobox", {
    id: "palette-input", placeholder: "Type a command",
    options: ["Open Settings", "Toggle sidebar", "Reset layout"]
  });
  combo.on("change", (event) => {
    palette.close();
    if (event.detail.value === "Open Settings") openSettings();
    else Mutakit.create("toast", { text: `${event.detail.value} — not wired in this demo` });
  });
}, { description: "Command palette" });

workspace.create("pane", {
  content: "Right-click me. Press Ctrl+K.", at: "center",
  traits: ["context-menu"],
  "context-menu": { items: [
    { label: "Cut", shortcut: "Ctrl+X" },
    { label: "Copy", shortcut: "Ctrl+C" },
    { separator: true },
    { label: "Paste", items: [{ label: "Plain text" }, { label: "Match style" }] }
  ] }
});
</script>
</body>
</html>
