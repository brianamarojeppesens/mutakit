<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mutakit — S2, the application chrome</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.5 system-ui, sans-serif;
               color: #16181d; background: #fff; }
  /* The library sizes and places the regions; how a shell *looks* is the
     application's business, so the chrome is styled here rather than shipped. */
  [data-mk-id="menubar"]   { background: #f7f8fa; border-bottom: 1px solid #e3e6ea; }
  [data-mk-id="explorer"]  { background: #fbfcfd; border-right: 1px solid #e3e6ea; }
  [data-mk-id="statusbar"] { background: #f7f8fa; border-top: 1px solid #e3e6ea;
                             font-size: 12px; color: #5b6270; }
  .tree-heading { font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
                  color: #5b6270; }
  .tree-item { padding: 3px 8px; border-radius: 5px; cursor: default; }
  .tree-item:hover { background: #eef1f4; }
</style>
</head>
<body>
<!--
  S2 — the application chrome (PLAN.md §1.3): a docked shell, a settings dialog
  with validation, a command palette, a context menu, and toasts. The M3/M4 demo.
-->
<script type="module">
import { Mutakit } from "../source/entries/full.js";

const app = Mutakit.mount(document.body, { sizing: "viewport" });

app.dock({
  regions: {
    top:    { size: 44, id: "menubar" },
    start:  { size: 240, id: "explorer" },
    bottom: { size: 26, id: "statusbar" },
    center: { id: "workspace" }
  }
});

const bar = Mutakit.byId("menubar");
bar.create("button", { text: "Settings…", at: "left", inset: 8, on: { activate: openSettings } });
bar.create("pane", { content: "Ctrl+K for the command palette", at: "right", inset: 12 });
Mutakit.byId("statusbar").create("pane", { content: "Ready", at: "left", inset: 8 });

// The explorer was declared 240px wide and left empty, so the shell rendered as
// a blank column: the region worked, there was simply nothing in it.
const explorer = Mutakit.byId("explorer");
const tree = explorer.create("stack", { axis: "y", gap: 2, at: "top-left",
                                        inset: 12, size: { w: "100%", h: "auto" } });
tree.create("pane", { content: "Explorer", class: "tree-heading" });
for (const name of ["index.html", "main.js", "styles.css", "README.md"]) {
  tree.create("pane", { content: name, class: "tree-item" });
}

// Written the way Appendix B.2 writes it: one declarative tree, slots filled
// by name, buttons invoking the dialog's own commands (§18.2). Nothing here is
// a function, so the whole dialog serializes.
function openSettings() {
  const dialog = Mutakit.create("dialog", {
    id: "prefs", title: "Settings", description: "Changes apply immediately.",
    size: { w: 480, h: "auto" },
    body: { type: "form", id: "prefs-form",
      values: { email: "", port: 8080 },
      schema: { email: { type: "string", required: true, format: "email" },
                port: { type: "number", min: 1, max: 65535, integer: true } },
      children: [
        { type: "field", label: "Notification email", required: true,
          control: { type: "text", name: "email", placeholder: "you@example.com" } },
        { type: "field", label: "Port", description: "1–65535",
          control: { type: "number", name: "port", min: 1, max: 65535 } }
      ]
    },
    actions: [
      { label: "Cancel", command: "cancel" },
      // Deliberately not the built-in `submit`. That command emits and then
      // dismisses in the same breath, so the dialog was gone before the form
      // had been asked whether it was valid — clicking Save with the required
      // email empty closed the dialog and silently saved nothing. A name that
      // is not one of the type's commands emits `action` and leaves the dialog
      // open, which is what lets validation have a say.
      { label: "Save", command: "save", variant: "primary" }
    ]
  });
  dialog.on("action", async (event) => {
    if (event.detail.action !== "save") return;
    const ok = await Mutakit.byId("prefs-form").submit();
    // Invalid: stay open. The form has already marked the offending fields and
    // moved focus to the first one, so there is nothing further to do here.
    if (!ok) return;
    dialog.submit();
    Mutakit.create("toast", { text: "Settings saved", variant: "success" });
  });
}

// A command palette on Mod+K, and a context menu anywhere in the workspace.
const workspace = Mutakit.byId("workspace");

Mutakit.default.service("shortcuts").bind("Mod+K", () => {
  const palette = Mutakit.create("modal", {
    id: "palette", size: { w: 520, h: "auto" }, at: "top", inset: { top: 80 },
    dismiss: "light", backdrop: true, title: "Command palette"
  });
  const combo = palette.create("combobox", {
    id: "palette-input", placeholder: "Type a command",
    options: ["Open Settings", "Toggle sidebar", "Reset layout"]
  });
  combo.on("change", (event) => {
    palette.close();
    if (event.detail.value === "Open Settings") openSettings();
    else Mutakit.create("toast", { text: `${event.detail.value} — not wired in this demo` });
  });
}, { description: "Command palette" });

workspace.create("pane", {
  content: "Right-click me. Press Ctrl+K.", at: "center",
  traits: ["context-menu"],
  "context-menu": { items: [
    { label: "Cut", shortcut: "Ctrl+X" },
    { label: "Copy", shortcut: "Ctrl+C" },
    { separator: true },
    { label: "Paste", items: [{ label: "Plain text" }, { label: "Match style" }] }
  ] }
});
</script>
</body>
</html>
