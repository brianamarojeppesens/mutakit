<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mutakit — S3, the game HUD</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1120; color: #e2e8f0;
               font: 14px/1.5 system-ui, sans-serif; overflow: hidden; }
  .stage { position: fixed; inset: 0;
           background: radial-gradient(circle at 50% 40%, #1e293b, #020617 70%); }
</style>
</head>
<body>
<div class="stage"></div>
<!--
  S3 — the game HUD (PLAN.md §1.3, §18.5), and the M5 demo: 100 elements driven
  by a fake game loop, holding 60fps. Every element uses only `at` + `inset` +
  `size`; nothing here computes a coordinate.
-->
<script type="module">
import { Mutakit } from "../source/entries/hud.js";

const app = Mutakit.mount(document.body, { sizing: "viewport" });
const hud = app.create("hud-layer", { id: "hud", spatial: true });

const health = Mutakit.signal(1);
const mana = Mutakit.signal(0.7);

hud.create("hud-bar", { id: "health", at: "top-left", inset: 16,
                        size: { w: 280, h: 20 }, value: health, variant: "health", label: "Health" });
hud.create("hud-bar", { id: "mana", at: "top-left", inset: { left: 16, top: 44 },
                        size: { w: 220, h: 12 }, value: mana, variant: "mana", label: "Mana" });
hud.create("minimap", { id: "map", at: "top-right", inset: 16, size: { w: "12gu", h: "12gu" } });
hud.create("crosshair", { id: "reticle", at: "center", size: { w: 28, h: 28 } });
const feed = hud.create("notification-feed", { id: "feed", at: "bottom-right", inset: 16,
                                               size: { w: 320 }, max: 5, ttl: 4000 });
hud.create("key-prompt", { id: "prompt", at: "bottom", inset: { bottom: 24 },
                           action: "Interact", keyboard: "E", gamepad: "A" });

// A world marker that follows a moving object, projected in the PAINT phase.
let angle = 0;
hud.create("hud-marker", {
  id: "objective",
  label: "Objective",
  project: () => ({
    x: window.innerWidth / 2 + Math.cos(angle) * 520,
    y: window.innerHeight / 2 + Math.sin(angle) * 320
  })
});

// 90 more bars, so the count is a hundred and the claim is testable.
for (let i = 0; i < 90; i++) {
  hud.create("hud-bar", {
    at: "bottom-left", inset: { left: 16 + (i % 15) * 24, bottom: 24 + Math.floor(i / 15) * 14 },
    size: { w: 20, h: 8 }, value: 1, variant: "stamina", ghost: false
  });
}

// The fake game loop.
let frame = 0;
const events = ["Wave cleared", "Shield restored", "Ammo low", "Objective moved"];
(function tick() {
  frame++;
  angle += 0.01;
  health(0.5 + Math.sin(frame / 40) * 0.5);
  mana(0.5 + Math.cos(frame / 55) * 0.5);
  if (frame % 180 === 0) feed.push(events[(frame / 180) % events.length | 0]);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
