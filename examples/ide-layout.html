<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mutakit — S1, the IDE layout</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.5 system-ui, sans-serif; }
  .label { padding: 10px 12px; color: #64748b; font-size: 12px; letter-spacing: 0.04em;
           text-transform: uppercase; }
  .hint { position: fixed; bottom: 10px; left: 12px; font-size: 12px; color: #64748b; }
  .hint kbd { background: #e2e8f0; border-radius: 3px; padding: 1px 5px; }
</style>
</head>
<body>
<!--
  S1 — the IDE / tool window (PLAN.md §1.3), and the M2 demo: the exact
  three-pane layout from the user's brief, resizable, collapsible, and restored
  across reload.

  Everything below is authoring code. There is no layout arithmetic in it: the
  panes declare intent and the library compiles it to grid tracks the browser
  resolves. Drag a gutter and watch the network tab stay empty — during a
  `neighbor` drag JavaScript writes exactly one custom property per pointer
  move, and the browser applies every bound.
-->
<script type="module">
import { Mutakit } from "../source/entries/dock.js";

const app = Mutakit.mount(document.body, { sizing: "viewport" });

// "create split panes with draggable separator, split vertically, with left
//  pane defaulting to 100 px."
const [left, right] = app.split({
  axis: "x",                                   // panes along x → vertical bar
  gutter: { size: 6, draggable: true },
  panes: [
    { id: "left",  size: 100, min: 64, max: "40%", collapsible: { at: 40, to: 0 } },
    { id: "right", size: "1fr" }
  ]
});

// "Now split right pane with draggable separator, split horizontally, with
//  bottom pane defaulting to 150 px."
const [stage, bottom] = right.split({
  axis: "y",
  gutter: { size: 6, draggable: true },
  panes: [
    { id: "stage",  size: "1fr" },
    { id: "bottom", size: 150, min: 80, collapsible: { at: 40, to: 0 } }
  ]
});

for (const [pane, name] of [[left, "explorer"], [stage, "editor"], [bottom, "terminal"]]) {
  pane.create("pane", { content: name, class: "label", left: 0, top: 0, right: 0 });
}

// Restore on load, save on a debounced timer. Restoring before the first frame
// means the saved layout never renders at its defaults and then snaps (§19.1).
Mutakit.persist("mutakit-ide-example", { allow: "any" });

document.body.insertAdjacentHTML(
  "beforeend",
  `<p class="hint">Drag a gutter · double-click one to collapse · focus one and use
   <kbd>←</kbd><kbd>→</kbd>, <kbd>Shift</kbd>+arrow, <kbd>Home</kbd>/<kbd>End</kbd>,
   <kbd>Enter</kbd> · reload to see the layout restored</p>`
);
</script>
</body>
</html>
